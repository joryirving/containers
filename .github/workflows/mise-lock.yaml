# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
#
# STOPGAP: Renovate bumps tool versions in mise configs but cannot regenerate
# the accompanying lockfiles (spawn mise ENOENT in the operator runtime; the
# npm-backed tools such as oxfmt = npm:oxfmt additionally need node to
# resolve). That drift makes `mise install --locked` (Labeler) fail on every
# PR and leaves image builds installing unlocked, checksum-unverified tools.
#
# This workflow regenerates every lockfile in the repo — the root
# .mise/mise.lock and each apps/<name>/mise.lock with its .mise/locks
# dependency sidecars — on a runner that has node available, and commits them
# back to the renovate branch. Remove once the lock is updated at the source
# (mise + node in the operator runtime, or oxfmt off the npm backend).
name: Mise Lock

on:
  pull_request:
    paths:
      - .mise/config.toml
      - .mise.toml
      - "**/mise.toml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  mise-lock:
    if: ${{ github.actor == 'smurf-bot[bot]' && startsWith(github.head_ref, 'renovate/') }}
    name: Mise Lock
    runs-on: ubuntu-26.04
    steps:
      - name: Generate Token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ secrets.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          experimental: true
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Update Lockfiles
        id: lock
        env:
          MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
        run: |
          mise lock
          # mise discovers configs upwards from the cwd, so locking each app
          # from its own directory scopes the lockfile (and dependency
          # sidecars) to that app without touching the root lock.
          for config in $(find apps -type f -name mise.toml | sort); do
            (cd "$(dirname "${config}")" && mise lock)
          done
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit Lockfiles
        if: ${{ steps.lock.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          bot_login="$(gh api user --jq .login)"
          bot_id="$(gh api user --jq .id)"
          git config user.name "${bot_login}"
          git config user.email "${bot_id}+${bot_login}@users.noreply.github.com"
          git add -A
          git commit -m "fix(mise): update lockfiles"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${HEAD_REF}"
