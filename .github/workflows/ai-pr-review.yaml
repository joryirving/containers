name: AI PR Review

on:
  pull_request:
    # `labeled` enables the one-click re-review: add the `ai-review` label to
    # force a fresh review (only write/triage can label — self-authorizing).
    types: [opened, reopened, synchronize, ready_for_review, labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:

concurrency:
  # `labeled` events get their own group so an auto-applied label can't cancel
  # the in-flight opened/synchronize review.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}${{ github.event.action == 'labeled' && format('-label-{0}', github.run_id) || '' }}${{ github.event_name == 'issue_comment' && '-comment' || '' }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    # Same-repository, non-draft PRs only: fork pull_request runs get no
    # secrets, so they would fail at the app-token step.
    if: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.id == github.repository_id && !github.event.pull_request.draft) || github.event_name == 'workflow_dispatch' || (github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.comment.body == '/ai-review') }}
    runs-on: ubuntu-latest
    steps:
      # A comment event runs the default-branch workflow, not the PR head.
      # Resolve and validate the exact same-repo, non-draft PR head before
      # privileged checkout/token creation; forks use their separate path.
      - name: Resolve PR head for comment re-review
        id: prctx
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo "::error::Invalid PR number"; exit 1; }
          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          if [[ "$(jq -r '.state' <<< "$pr_json")" != "open" ||
                "$(jq -r '.draft' <<< "$pr_json")" != "false" ||
                "$(jq -r '.head.repo.id // empty' <<< "$pr_json")" != "$REPOSITORY_ID" ]]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "Skipping comment review: closed, draft, or fork PR." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          head_sha="$(jq -r '.head.sha // empty' <<< "$pr_json")"
          [[ "$head_sha" =~ ^[[:xdigit:]]{40}$ ]] || { echo "::error::Invalid PR head SHA"; exit 1; }
          printf "eligible=true\nhead_sha=%s\n" "$head_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        if: github.event_name != 'issue_comment' || steps.prctx.outputs.eligible == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || steps.prctx.outputs.head_sha || github.sha }}
          persist-credentials: false

      - name: Generate bot token
        if: github.event_name != 'issue_comment' || steps.prctx.outputs.eligible == 'true'
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.SAFFRON_APP_ID }}
          private-key: ${{ secrets.SAFFRON_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: write

      - name: Review PR
        if: github.event_name == 'pull_request' || (github.event_name == 'issue_comment' && steps.prctx.outputs.eligible == 'true')
        id: review
        uses: misospace/pr-reviewer-action@e207a7d11d2ee41f77493b2314e30e7ca694da50 # v3.6.0
        env:
          PR_REVIEWER_GATE_HEAD_SHA: ${{ steps.prctx.outputs.head_sha }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          pr-number: ${{ github.event.pull_request.number || github.event.issue.number }}
          ai-base-url: ${{ vars.LITELLM_URL }}
          ai-api-format: ${{ vars.PRIMARY_FORMAT }}
          ai-model: ${{ vars.PRIMARY_MODEL }}
          primary-model-context-tokens: ${{ vars.PRIMARY_CONTEXT_TOKENS }}
          ai-api-key: ${{ secrets.LITELLM_API_KEY }}
          ai-response-format: json_object
          ai-fallback-base-url: ${{ vars.LITELLM_URL }}
          ai-fallback-api-format: ${{ vars.FALLBACK_FORMAT }}
          ai-fallback-model: ${{ vars.FALLBACK_MODEL }}
          fallback-model-context-tokens: ${{ vars.FALLBACK_CONTEXT_TOKENS }}
          ai-fallback-api-key: ${{ secrets.LITELLM_API_KEY }}
          review-routing-mode: auto
          repository-skills: "true"
          review-verbosity: concise
          ai-smart-base-url: ${{ vars.LITELLM_URL }}
          ai-smart-api-format: ${{ vars.SMART_FORMAT }}
          ai-smart-model: ${{ vars.SMART_MODEL }}
          smart-model-context-tokens: ${{ vars.SMART_CONTEXT_TOKENS }}
          ai-smart-api-key: ${{ secrets.LITELLM_API_KEY }}
          allowed-source-hosts: "*"
          ci-timeout-sec: "1200"
          tool-allowed-gh-api-repos: "*"
          standards-file-candidates: "AGENTS.md,.agents/*"
          claim-falsification: "true"
          publish-mode: review_verdict
          allow-approve: "true"
