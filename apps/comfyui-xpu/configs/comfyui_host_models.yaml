# Maps the comfyui PVC's models/ tree into ComfyUI's folder registry. The
# deployment mounts the PVC's models/ at /models/host; user/, input/, and
# output/ are mounted directly over /llm/ComfyUI/{user,input,output}.
host_models:
  base_path: /models/host
  checkpoints: checkpoints
  configs: configs
  loras: loras
  vae: vae
  text_encoders: |
    text_encoders
    clip
  diffusion_models: |
    unet
    diffusion_models
  clip_vision: clip_vision
  style_models: style_models
  embeddings: embeddings
  diffusers: diffusers
  vae_approx: vae_approx
  controlnet: |
    controlnet
    t2i_adapter
  gligen: gligen
  upscale_models: upscale_models
  latent_upscale_models: latent_upscale_models
  hypernetworks: hypernetworks
  photomaker: photomaker
  classifiers: classifiers
  model_patches: model_patches
  audio_encoders: audio_encoders
  background_removal: background_removal
  frame_interpolation: frame_interpolation
